  - {id: sala-3, name: Sala 3, description: Seguridad, source_lang: en, input: caster}
  - {id: sala-4, name: Sala 4, description: Datos e IA, source_lang: en, input: caster}
  - {id: sala-5, name: Sala 5, description: Comunidad, source_lang: es, input: caster}
  - {id: taller, name: Taller, description: Idioma variable, source_lang: auto, input: caster}
