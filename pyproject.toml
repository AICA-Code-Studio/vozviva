[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vozviva"
version = "0.1.0"
description = "Subtítulos en vivo, abiertos, para conferencias con varias salas en paralelo"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110", "uvicorn[standard]>=0.29", "pyyaml>=6.0", "numpy>=1.26",
  "httpx>=0.27", "google-genai>=2.25", "redis>=5.0", "segno>=1.6", "tzdata>=2024.1",
]

[project.optional-dependencies]
local = ["faster-whisper>=1.0"]
dev = ["pytest>=8"]

[project.scripts]
vozviva = "vozviva.__main__:main"

[tool.setuptools.packages.find]
include = ["vozviva*"]

[tool.setuptools.package-data]
vozviva = ["static/*"]
