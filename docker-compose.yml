# Un nodo con todas las salas:   docker compose up vozviva   (necesita config.yaml y .env)
# Varias máquinas: ver docs/DESPLIEGUE.md (perfil "distribuido").
services:
  vozviva:
    build: .
    env_file: .env
    ports: ["8000:8000", "9001:9001/udp", "1935:1935"]
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./data:/app/data
    restart: unless-stopped

  # Demo sin API key:   docker compose --profile demo up --build demo
  demo:
    build: .
    profiles: [demo]
    command: ["python", "-m", "vozviva", "serve", "-c", "config.demo.yaml"]
    ports: ["8000:8000"]

  redis:
    image: redis:7-alpine
    profiles: [distribuido]
    restart: unless-stopped

  web:
    build: .
    profiles: [distribuido]
    env_file: .env
    environment: {VOZVIVA_REDIS_URL: "redis://redis:6379/0", VOZVIVA_SESSIONS: none}
    volumes: ["./config.yaml:/app/config.yaml:ro"]
    ports: ["8080:8000"]
    depends_on: [redis]
